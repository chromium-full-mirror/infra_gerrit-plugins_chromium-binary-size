<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
<title>chromium-binary-size-view</title>

<script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
<script src="../node_modules/web-component-tester/browser.js"></script>

<test-fixture id="basic">
  <template>
    <chromium-binary-size-view></chromium-binary-size-view>
  </template>
</test-fixture>

<script type="module">
import './common-test-setup.js';
import {BuildbucketV2Client} from './common-test-setup.js';
import '../static/chromium-binary-size-view.js';
import {DATA_SYMBOL} from '../static/checks-result.js';

suite('chromium-binary-size-view basic tests', () => {
  let element;
  let sandbox;

  setup(() => {
    element = fixture('basic');
    Object.assign(element, {
      plugin: {
        getPluginName() { return 'chromium-binary-size'; },
        restApi() {
          return {
            getLoggedIn: async () => true,
          };
        },
        checks() {
          return {
            register: () => ({}),
            announceUpdate: () => ({}),
          }
        }
      },
      change: {
        project: 'project-foo',
        _number: 1,
        revisions: {
          'deadbeef': {
            _number: 1,
          },
        },
      },
      _pluginConfig: {
        gerritHost: 'gerrit.example.com',
        tryBucket: 'try',
        tryBuilder: 'android-binary-size',
        tryProject: 'chromium',
      },
      _enabled: true,
      revision: {
        _number: 1,
      },
    });
    window.buildbucket = {
      getAccessToken: async () => null,
      compareBuildIds: (a, b) => {
        const d = b.length - a.length;
        if (d != 0) {
          return d;
        }
        if (a > b) {
          return -1;
        }
        if (a < b) {
          return 1;
        }
        return 0;
      },
      BuildbucketV2Client,
    };
    sandbox = sinon.sandbox.create();

  });

  teardown(() => {
    sandbox.restore();
  });

  test('renders the element', () => {
    assert.isOk(element);
  });

  test('_getBuilds', async () => {
    const searchBuilds = sandbox.stub(
        BuildbucketV2Client.prototype, 'searchBuilds');
    searchBuilds.returns(Promise.resolve({builds: ['build1', 'build2']}));

    const predicate1 = {host:'gerrit.example.com',change:42,patchset:2};
    assert.deepEqual(
        await element._getBuilds(
          'some.bucket', [predicate1]),
        ['build1', 'build2']);
    const params = searchBuilds.getCall(0).args[0];
    assert.deepEqual(params['predicate']['gerritChanges'][0], predicate1);
    assert.deepEqual(params['predicate']['builder']['builder'], 'android-binary-size');
  });

  test('_selectRelevantBuilds', () => {
    const builds = [
        {'endTime': '1234', output:{properties:{binary_size_plugin:{}}}},
        {output:{properties:{binary_size_plugin:{}}}},
        {output:{properties:{}}},
        {}];
    assert.deepEqual(element._selectRelevantBuild(builds), builds[0]);
  });

  test('_tryjobPatchPredicates', () => {
    element.change = {_number: 42};
    element._pluginConfig = {gerritHost: 'chromium-review.googlesource.com'};
    assert.deepEqual(element._tryjobPatchPredicates([2, 3, 4]), [
        {
          host: 'chromium-review.googlesource.com',
          change: 42,
          patchset: 2,
        },
        {
          host: 'chromium-review.googlesource.com',
          change: 42,
          patchset: 3,
        },
        {
          host: 'chromium-review.googlesource.com',
          change: 42,
          patchset: 4,
        },
    ]);
  });

  test('exponential backoff', async () => {
    assert.isNotOk(element._updateTimeoutID);
    sandbox.stub(
        BuildbucketV2Client.prototype, 'searchBuilds',
        () => Promise.reject('nope'));
    const timeoutMs = element._updateIntervalMs;
    await element._refresh();
    assert.isAbove(element._updateIntervalMs, 2 * timeoutMs);
    assert.isOk(element._updateTimeoutID);
  });

  test('valid patch numbers', () => {
    let change = {
      revisions: {
        rev1: {_number: 1, kind: 'TRIVIAL_REBASE'},
        rev2: {_number: 2, kind: 'TRIVIAL_REBASE'},
        rev3: {_number: 3, kind: 'TRIVIAL_REBASE'},
      },
    };
    assert.deepEqual(element._computeValidPatchNums(change, 3), [3, 2, 1]);
    assert.deepEqual(element._computeValidPatchNums(change, 2), [2, 1]);

    change.status = 'MERGED';
    assert.deepEqual(element._computeValidPatchNums(change, 3), [2, 1]);

    change = {
      revisions: {
        rev1: {_number: 1, kind: 'TRIVIAL_REBASE'},
        rev2: {_number: 2, kind: 'REBASE'},
        rev3: {_number: 3, kind: 'TRIVIAL_REBASE'},
      },
    };

    assert.deepEqual(element._computeValidPatchNums(change, 3), [3, 2]);
  });

  test('UI mutual exclusivity', async () => {
    let uiMethods = [
      element.shouldShowBinarySizeTable,
      element.shouldShowNoTrybotScheduled,
      element.shouldShowWaitingForTrybotRun,
      element.shouldShowWaitingForTrybotToSchedule,
    ];
    [{loaded: true}, {loaded: false}, undefined].forEach((binarySizeInfo) => {
      [true, false].forEach((waitingForTrybotSchedule) => {
        [true, false].forEach((waitingForTrybotResult) => {
          let result = uiMethods.map(
              (method) => method.call(
                  element, binarySizeInfo, waitingForTrybotSchedule, waitingForTrybotResult));
          // Only one function should be truthy
          assert.equal(result.filter((val) => !!val).length, 1);
        });
      });
    });
  });

  test('getCheckRunStatus', () => {
    assert.strictEqual(
        element.getCheckRunStatus({}), 'RUNNABLE');
    assert.strictEqual(
        element.getCheckRunStatus({status: 'SCHEDULED'}), 'RUNNING');
    assert.strictEqual(
        element.getCheckRunStatus({status: 'STARTED'}), 'RUNNING');
    assert.strictEqual(
        element.getCheckRunStatus({status: 'FAILURE'}), 'COMPLETED');
  });

  test('getCheckRunStatusDesc', () => {
    assert.strictEqual(
        element.getCheckRunStatusDesc({}),
        'Run the android-binary-size trybot');
    assert.strictEqual(
        element.getCheckRunStatusDesc({status: 'SCHEDULED'}),
        'Scheduling the android-binary-size tryjob');
    assert.strictEqual(
        element.getCheckRunStatusDesc({status: 'STARTED'}),
        'Waiting for the android-binary-size trybot run to complete');
    assert.strictEqual(
        element.getCheckRunStatusDesc({status: 'FAILURE'}),
        '');
  });

  test('getCheckResultCategory', () => {
    assert.strictEqual(
        element.getCheckResultCategory({status: 'SUCCESS'}, [{allowed: true}]),
        'INFO');
    assert.strictEqual(
        element.getCheckResultCategory({status: 'SUCCESS'}, [{allowed: false}]),
        'WARNING');
    assert.strictEqual(
        element.getCheckResultCategory({status: 'FAILURE'}, [{allowed: true}]), 
        'INFO');
    assert.strictEqual(
        element.getCheckResultCategory({status: 'FAILURE'}, [{allowed: false}]),
        'ERROR');
  });

  test('isEnabled caches results', async () => {
    const stub = sandbox.stub();
    stub.withArgs('/projects/foo/chromium-binary-size~config').returns(Promise.resolve({a: 1}));
    stub.withArgs('/projects/bar/chromium-binary-size~config').returns(Promise.reject());
    element.plugin.restApi = () => ({
      get: stub,
    });
    assert.strictEqual(await element.isEnabled('foo'), true);
    assert.strictEqual(await element.isEnabled('bar'), false);
    sinon.assert.calledTwice(stub);

    // Results should be cached.
    assert.strictEqual(await element.isEnabled('foo'), true);
    assert.strictEqual(await element.isEnabled('bar'), false);
    sinon.assert.calledTwice(stub);
  });

  test('fetchChecks formats extra CheckResult links', async () => {
    sandbox.stub(element, 'isEnabled').returns(true);
    const searchBuilds = sandbox.stub(
        BuildbucketV2Client.prototype, 'searchBuilds').returns({
      builds: [
        {
          id: '1',
          status: 'SUCCESS',
          endTime: '2019-05-29T23:41:18.637847Z',
          output: {
            properties: {
              binary_size_plugin: {
                extras: [
                  {text: 'APK Breakdown', url: 'http://apk.org'},
                  {text: 'Extra Link', url: 'http://extra.org'},
                ],
                listings: [],
              }
            }
          }
        }
      ]
    });
    const res = await element.fetchChecks({
      changeNumber: 1,
      patchsetNumber: 1,
      repo: 'repo',
      changeInfo: {
        project: 'project-foo',
        _number: 1,
        revisions: {
          'deadbeef': {
            _number: 1,
          },
        },
      },
    });
    const {links} = res.runs[0].results[0];
    assert.deepEqual(links, [
      {
        url: 'http://apk.org',
        tooltip: 'APK Breakdown',
        primary: true,
        icon: 'file_present',
      },
      {
        url: 'http://extra.org',
        tooltip: 'Extra Link',
        primary: false,
        icon: 'external',
      },
    ]);
  });

  test('fetchChecks uses the latest build with output', async () => {
    sandbox.stub(element, 'isEnabled').returns(true);
    const searchBuilds = sandbox.stub(
        BuildbucketV2Client.prototype, 'searchBuilds').returns({
      builds: [
        {
          id: '3',
          status: 'SUCCESS',
          endTime: '2019-05-29T23:41:18.637847Z',
          output: {
            properties: {
              binary_size_plugin: {
                extras: [],
                listings: [
                  {name: 'foo', allowed: true},
                ],
              }
            }
          }
        },
        {
          id: '2',
          status: 'SUCCESS',
          endTime: '2019-06-29T23:41:18.637847Z',
          output: {
            properties: {
              binary_size_plugin: {
                extras: [],
                listings: [
                  {name: 'bar', allowed: true},
                ],
              }
            }
          }
        },
        {
          id: '1',
          status: 'CANCELED',
          endTime: '2019-06-29T23:41:18.637847Z',
          output: {
            properties: {},
          }
        }
      ]
    });
    const res = await element.fetchChecks({
      changeNumber: 1,
      patchsetNumber: 1,
      repo: 'repo',
      changeInfo: {
        project: 'project-foo',
        _number: 1,
        revisions: {
          'deadbeef': {
            _number: 1,
          },
        },
      },
    });
    const run = res.runs[0];
    assert.deepEqual(run[DATA_SYMBOL].listings, [{name: 'bar', allowed: true}]);
  });

  test('fetchChecks creates CheckResults', async () => {
    sandbox.stub(element, 'isEnabled').returns(true);
    const searchBuilds = sandbox.stub(
        BuildbucketV2Client.prototype, 'searchBuilds');
    const changeData = {
      changeNumber: 1,
      patchsetNumber: 1,
      repo: 'repo',
      changeInfo: {
        project: 'project-foo',
        _number: 1,
        revisions: {
          'deadbeef': {
            _number: 1,
          },
        },
      },
    };
    let res;
    let run;

    // android-binary-size trybot has not been run.
    searchBuilds.returns(Promise.resolve({builds: []}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'RUNNABLE');
    assert.strictEqual(run.results.length, 0);
    assert.strictEqual(run.actions[0].name, 'Run');
    assert.deepEqual(run[DATA_SYMBOL].listings, []);

    // android-binary-size trybot has been scheduled.
    searchBuilds.returns(Promise.resolve({builds: [
      {status: 'SCHEDULED'},
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'RUNNING');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'INFO');
    assert.strictEqual(
        run.results[0].message,
        'Scheduling the android-binary-size tryjob.');
    assert.strictEqual(run.actions.length, 0);
    assert.deepEqual(run[DATA_SYMBOL].listings, []);

    // android-binary-size trybot has started.
    searchBuilds.returns(Promise.resolve({builds: [
      {status: 'STARTED'},
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'RUNNING');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'INFO');
    assert.strictEqual(
        run.results[0].message,
        'Waiting for android-binary-size trybot run to complete.');
    assert.strictEqual(run.actions.length, 0);
    assert.deepEqual(run[DATA_SYMBOL].listings, []);

    // android-binary-size trybot and its checks were successful.
    const allowedListings = [
      {name: 'foo', allowed: true},
      {name: 'bar', allowed: true},
    ];
    searchBuilds.returns(Promise.resolve({builds: [
      {
        id: '1',
        status: 'SUCCESS',
        endTime: '2019-05-29T23:41:18.637847Z',
        output: {
          properties: {
            binary_size_plugin: {
              listings: allowedListings,
            },
          },
        },
      },
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'COMPLETED');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'INFO');
    assert.strictEqual(run.actions.length, 0);
    assert.deepEqual(run[DATA_SYMBOL].listings, allowedListings);

    // android-binary-size trybot but its checks were not successful.
    const unallowedListings = [
      {name: 'foo', allowed: true},
      {name: 'bar', allowed: false},
    ];
    searchBuilds.returns(Promise.resolve({builds: [
      {
        id: '1',
        status: 'SUCCESS',
        endTime: '2019-05-29T23:41:18.637847Z',
        output: {
          properties: {
            binary_size_plugin: {
              listings: unallowedListings,
            },
          },
        },
      },
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'COMPLETED');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'WARNING');
    assert.strictEqual(run.actions.length, 0);
    assert.deepEqual(run[DATA_SYMBOL].listings, unallowedListings);

    // android-binary-size trybot was unsuccessful.
    searchBuilds.returns(Promise.resolve({builds: [
      {
        id: '1',
        status: 'FAILURE',
        endTime: '2019-05-29T23:41:18.637847Z',
        output: {
          properties: {
            binary_size_plugin: {
              listings: unallowedListings,
            },
          },
        },
      },
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'COMPLETED');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'ERROR');
    assert.strictEqual(run.actions.length, 0);
    assert.deepEqual(run[DATA_SYMBOL].listings, unallowedListings);

    // android-binary-size trybot was canceled.
    searchBuilds.returns(Promise.resolve({builds: [
      {
        id: '1',
        status: 'CANCELED',
        endTime: '2019-05-29T23:41:18.637847Z',
      },
    ]}));
    res = await element.fetchChecks(changeData);
    run = res.runs[0];
    assert.strictEqual(run.status, 'COMPLETED');
    assert.strictEqual(run.results.length, 1);
    assert.strictEqual(run.results[0].category, 'INFO');
    assert.strictEqual(
        run.results[0].message,
        'Run the android-binary-size trybot on the latest patchset to see ' +
            'your binary size impact.',
        );
    assert.strictEqual(run.actions[0].name, 'Run');
    assert.deepEqual(run[DATA_SYMBOL].listings, []);
  });
});
</script>
