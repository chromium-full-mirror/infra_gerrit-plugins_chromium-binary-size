<script src="./auth.js"></script>
<script src="./buildbucket-client.js"></script>

<link rel="import" href="./chromium-binary-size-view.html">
<script>
'use strict';

Gerrit.install((plugin) => {
  if (!window.Polymer) { return; } // Only supported in PolyGerrit.

  window.ChromiumBinarySize.initAuth(plugin);
  plugin.registerCustomComponent('change-view-integration', 'chromium-binary-size-view');
});
</script>
